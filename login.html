<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Article Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">Article<span>Hub</span></a>
      <nav class="nav-links">
        <a href="index.html">Articles</a>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="page-title" style="text-align:center">Author sign in</h1>
    <p class="page-subtitle" style="text-align:center">Sign in to publish articles to the cloud.</p>

    <div class="form-card">
      <div id="status"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" minlength="6" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign in</button>
      </form>

      <p class="form-hint" style="margin-top:1.5rem;text-align:center">
        No account yet? <a href="#" id="toggle-signup">Create one</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    Powered by Supabase (free cloud database)
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
