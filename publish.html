<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write Article — Article Hub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">Article<span>Hub</span></a>
      <nav class="nav-links">
        <span class="auth-bar"></span>
        <a href="index.html">Articles</a>
        <a href="publish.html" class="active">Write</a>
        <a href="#" data-nav="logout">Sign out</a>
      </nav>
    </div>
  </header>

  <main>
    <h1 class="page-title">Publish an article</h1>
    <p class="page-subtitle">Your article is saved online in Supabase — not on this device.</p>

    <div class="form-card">
      <div id="status"></div>

      <form id="publish-form">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" required maxlength="200" placeholder="My first article">
        </div>
        <div class="form-group">
          <label for="content">Content</label>
          <textarea id="content" name="content" required placeholder="Write your article here…

Use ## for headings, **bold**, *italic*, - for lists, and > for quotes."></textarea>
          <p class="form-hint">Supports simple Markdown-style formatting.</p>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submit-btn">Publish</button>
          <a href="index.html" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    Powered by Supabase (free cloud database)
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/publish.js"></script>
</body>
</html>
