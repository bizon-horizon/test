<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publish - ArticleHub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html">ArticleHub</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="publish.html">Publish</a>
      <a href="chat.html">Chat</a>
      <span id="userBadge" class="user-badge"></span>
      <a href="auth.html" id="authLink">Log in</a>
      <button id="logoutBtn" class="btn btn-ghost btn-sm hidden">Log out</button>
    </nav>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>Publish an article</h1>
    </div>

    <form id="publishForm" class="card">
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="Your article title" required maxlength="200" />
      </div>
      <div class="form-group">
        <label for="content">Content</label>
        <textarea id="content" name="content" placeholder="Write your article here. Blank lines become paragraphs..." required></textarea>
      </div>
      <button type="submit" id="submitBtn" class="btn btn-primary">Publish</button>
    </form>
  </main>

  <script src="lib/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="publish.js"></script>
</body>
</html>
