<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in / Sign up - ArticleHub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html">ArticleHub</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="publish.html">Publish</a>
      <a href="chat.html">Chat</a>
      <span id="userBadge" class="user-badge"></span>
      <a href="auth.html" id="authLink">Log in</a>
      <button id="logoutBtn" class="btn btn-ghost btn-sm hidden">Log out</button>
    </nav>
  </header>

  <main class="container">
    <div class="card auth-card">
      <h1>Welcome</h1>

      <div class="tabs">
        <button type="button" class="tab-btn active" data-tab="login">Log in</button>
        <button type="button" class="tab-btn" data-tab="signup">Sign up</button>
      </div>

      <p id="message" class="muted" style="min-height: 22px;"></p>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required autocomplete="current-password" />
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary">Log in</button>
      </form>

      <form id="signupForm" class="hidden">
        <div class="form-group">
          <label for="signupUsername">Username</label>
          <input type="text" id="signupUsername" required maxlength="30" placeholder="Visible to other users" />
        </div>
        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input type="email" id="signupEmail" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" id="signupBtn" class="btn btn-primary">Sign up</button>
      </form>
    </div>
  </main>

  <script src="lib/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="auth.js"></script>
</body>
</html>
