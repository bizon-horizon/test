<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broadside</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EFE7D8;
    --paper-2: #E6DCC7;
    --ink: #1B2B22;
    --ink-soft: #445448;
    --forest: #2F4A3C;
    --forest-dark: #223629;
    --gold: #B08830;
    --gold-soft: #cfae63;
    --rule: #C9BFA6;
    --rust: #9c4a2e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background: var(--gold-soft); color: var(--forest-dark); }

  @media (prefers-reduced-motion: no-preference){
    .fade-in{ animation: fadeIn .5s ease both; }
    @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  }

  a{ color: inherit; }
  button{ font-family: inherit; cursor:pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--gold); outline-offset: 2px;
  }

  .wrap{ max-width: 760px; margin: 0 auto; padding: 0 24px 96px; }

  /* ---------- Masthead ---------- */
  header.masthead{
    background: var(--forest);
    color: var(--paper);
    padding: 28px 24px 0;
    position: relative;
  }
  .masthead-inner{
    max-width: 760px; margin: 0 auto;
    display:flex; align-items:flex-end; justify-content:space-between;
    padding-bottom: 22px;
    flex-wrap: wrap; gap: 14px;
  }
  .brand{ display:flex; flex-direction:column; gap:4px; }
  .brand .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color: var(--gold-soft);
  }
  .brand h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: clamp(34px, 6vw, 52px);
    letter-spacing: -0.01em;
    margin:0;
    line-height: .95;
  }
  .masthead-meta{
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px; color: var(--gold-soft);
    text-align:right; line-height:1.6;
  }

  nav.tabs{
    display:flex; gap: 2px;
    max-width: 760px; margin: 0 auto;
  }
  nav.tabs button{
    background:transparent; border:none;
    color: var(--paper); opacity:.6;
    font-family:'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing:.1em; text-transform:uppercase;
    padding: 12px 4px; margin-right: 22px;
    border-bottom: 2px solid transparent;
    transition: opacity .15s, border-color .15s;
  }
  nav.tabs button:hover{ opacity:.85; }
  nav.tabs button.active{
    opacity:1; border-bottom-color: var(--gold);
  }

  /* torn deckle edge between header and page */
  .deckle{
    height: 14px;
    background: var(--forest);
    -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='14' viewBox='0 0 40 14'><path d='M0 14 L5 4 L10 12 L15 2 L20 10 L25 3 L30 13 L35 5 L40 14 Z' fill='black'/></svg>");
    -webkit-mask-size: 40px 14px;
    -webkit-mask-repeat: repeat-x;
    mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='14' viewBox='0 0 40 14'><path d='M0 14 L5 4 L10 12 L15 2 L20 10 L25 3 L30 13 L35 5 L40 14 Z' fill='black'/></svg>");
    mask-size: 40px 14px;
    mask-repeat: repeat-x;
  }

  /* ---------- Index / list view ---------- */
  .issue-line{
    display:flex; align-items:center; gap:12px;
    margin: 40px 0 28px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px; letter-spacing:.14em; text-transform:uppercase;
    color: var(--ink-soft);
  }
  .issue-line::after{ content:""; flex:1; height:1px; background: var(--rule); }

  .entry{
    display:block;
    padding: 22px 0;
    border-bottom: 1px solid var(--rule);
    text-decoration:none;
    position:relative;
  }
  .entry:first-child{ padding-top: 4px; }
  .entry-row{ display:flex; gap: 18px; align-items:baseline; }
  .entry-num{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px; color: var(--gold); flex-shrink:0; width: 32px;
  }
  .entry-title{
    font-family:'Fraunces', serif;
    font-weight:600; font-size: 23px;
    line-height:1.25;
    margin: 0 0 6px;
    display:inline-block;
    background-image: linear-gradient(var(--ink), var(--ink));
    background-position: 0 100%;
    background-repeat: no-repeat;
    background-size: 0% 1px;
    transition: background-size .25s ease;
    padding-bottom: 1px;
  }
  .entry:hover .entry-title{ background-size: 100% 1px; }
  .entry-excerpt{
    color: var(--ink-soft); font-size: 15.5px; line-height:1.55;
    margin: 0 0 8px 50px;
  }
  .entry-meta{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px; color: var(--ink-soft); opacity:.75;
    margin-left: 50px; letter-spacing:.04em;
  }

  .empty{
    padding: 60px 0; text-align:center; color: var(--ink-soft);
  }
  .empty .stamp{
    font-family:'JetBrains Mono', monospace; font-size:11px;
    letter-spacing:.2em; text-transform:uppercase; color: var(--gold);
    border: 1px solid var(--gold); display:inline-block;
    padding: 4px 12px; margin-bottom: 14px; transform: rotate(-2deg);
  }

  /* ---------- Article view ---------- */
  .article-nav{
    margin: 34px 0 10px;
    font-family:'JetBrains Mono', monospace; font-size: 12px;
    letter-spacing:.08em; text-transform:uppercase;
  }
  .article-nav a{ text-decoration:none; color: var(--forest); border-bottom: 1px solid var(--rule); padding-bottom:2px; }
  .article-nav a:hover{ border-color: var(--forest); }

  article.piece{ padding-top: 18px; }
  .piece-eyebrow{
    font-family:'JetBrains Mono', monospace; font-size: 11.5px;
    letter-spacing:.14em; text-transform:uppercase; color: var(--gold);
    margin-bottom: 10px;
  }
  .piece h2{
    font-family:'Fraunces', serif; font-weight:700;
    font-size: clamp(30px, 5vw, 44px); line-height:1.08; letter-spacing:-.01em;
    margin: 0 0 14px;
  }
  .piece .byline{
    font-family:'JetBrains Mono', monospace; font-size:12px; color: var(--ink-soft);
    padding-bottom: 22px; margin-bottom: 26px; border-bottom: 1px solid var(--rule);
  }
  .piece .body-text{
    font-size: 18.5px; line-height:1.75; color: var(--ink);
  }
  .piece .body-text p{ margin: 0 0 1.3em; }
  .piece .body-text p:first-of-type::first-letter{
    font-family:'Fraunces', serif; font-weight:700; font-size: 3.6em;
    float:left; line-height:.8; padding: .06em .08em 0 0; color: var(--forest);
  }

  .danger-zone{ margin-top: 48px; padding-top: 18px; border-top: 1px dashed var(--rule); }
  .btn-ghost-danger{
    background:none; border: 1px solid var(--rust); color: var(--rust);
    font-family:'JetBrains Mono', monospace; font-size: 11px; letter-spacing:.08em; text-transform:uppercase;
    padding: 7px 14px; border-radius:2px;
  }
  .btn-ghost-danger:hover{ background: var(--rust); color: var(--paper); }

  /* ---------- Compose view ---------- */
  .compose-head{ margin: 40px 0 26px; }
  .compose-head h2{
    font-family:'Fraunces', serif; font-weight:600; font-size: 30px; margin:0 0 6px;
  }
  .compose-head p{ color: var(--ink-soft); font-size: 14.5px; margin:0; }

  .field{ margin-bottom: 20px; }
  .field label{
    display:block; font-family:'JetBrains Mono', monospace; font-size: 11px;
    letter-spacing:.12em; text-transform:uppercase; color: var(--ink-soft); margin-bottom: 7px;
  }
  .field input[type=text], .field input[type=password], .field textarea{
    width:100%; background: var(--paper-2); border: 1px solid var(--rule);
    border-radius: 2px; padding: 12px 13px; color: var(--ink);
    font-family:'Source Serif 4', serif; font-size: 16px;
  }
  .field input[type=text]{ font-family:'Fraunces', serif; font-weight:600; font-size:20px; }
  .field textarea{ min-height: 320px; resize: vertical; line-height:1.6; }
  .hint{ font-size:12.5px; color: var(--ink-soft); margin-top:6px; }

  .btn-primary{
    background: var(--forest); color: var(--paper); border:none;
    font-family:'JetBrains Mono', monospace; font-size: 12px; letter-spacing:.1em; text-transform:uppercase;
    padding: 13px 24px; border-radius: 2px; transition: background .15s;
  }
  .btn-primary:hover{ background: var(--forest-dark); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }

  .btn-text{
    background:none; border:none; color: var(--ink-soft); text-decoration:underline;
    font-size: 13px; padding: 10px 0;
  }

  .lock-panel{
    margin-top: 40px; padding: 30px; background: var(--paper-2);
    border: 1px solid var(--rule); border-radius: 3px; max-width: 380px;
  }
  .lock-panel .stamp-small{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color: var(--gold); margin-bottom: 14px;
  }
  .lock-panel p{ font-size: 14px; color: var(--ink-soft); margin: 0 0 18px; line-height:1.5; }
  .row-btn{ display:flex; gap: 10px; align-items:center; margin-top:16px; }
  .error-text{ color: var(--rust); font-size: 13px; margin-top: 8px; }

  .toast{
    position: fixed; bottom: 22px; left:50%; transform: translateX(-50%) translateY(120%);
    background: var(--forest); color: var(--paper);
    font-family:'JetBrains Mono', monospace; font-size:12.5px; letter-spacing:.06em;
    padding: 12px 20px; border-radius: 3px; box-shadow: 0 8px 24px rgba(0,0,0,.25);
    transition: transform .35s ease; z-index: 50;
  }
  .toast.show{ transform: translateX(-50%) translateY(0); }

  footer{
    text-align:center; padding: 30px 24px 50px;
    font-family:'JetBrains Mono', monospace; font-size: 10.5px; color: var(--ink-soft);
    letter-spacing:.1em; text-transform:uppercase;
  }

  @media (max-width: 480px){
    .entry-excerpt, .entry-meta{ margin-left: 0; }
    .entry-row{ flex-direction:column; gap:4px; }
    .piece .body-text{ font-size:17px; }
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <div class="brand">
      <div class="eyebrow">Est. this year &middot; single-sheet dispatches</div>
      <h1>Broadside</h1>
    </div>
    <div class="masthead-meta" id="mastheadMeta">No. 000 &middot; loading&hellip;</div>
  </div>
  <nav class="tabs">
    <button id="tabRead" class="active">Read</button>
    <button id="tabWrite">Write</button>
  </nav>
</header>
<div class="deckle"></div>

<div class="wrap" id="app"></div>

<div class="toast" id="toast"></div>

<footer>Printed in the browser &middot; stored for every reader to find</footer>

<script>
const STORAGE_KEY = 'broadside-articles';
const CONFIG_KEY = 'broadside-config';
let articles = [];
let config = null;
let unlocked = false;
let route = { view: 'index' }; // {view:'index'} | {view:'article', id} | {view:'write'}

const app = document.getElementById('app');
const mastheadMeta = document.getElementById('mastheadMeta');
const tabRead = document.getElementById('tabRead');
const tabWrite = document.getElementById('tabWrite');

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2400);
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function paragraphize(text){
  return text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean)
    .map(p => `<p>${escapeHtml(p).replace(/\n/g,'<br>')}</p>`).join('');
}

function readMins(text){
  const words = text.trim().split(/\s+/).filter(Boolean).length;
  return Math.max(1, Math.round(words / 200));
}

function formatDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' });
}

function updateMasthead(){
  const n = articles.length;
  mastheadMeta.innerHTML = `No. ${String(n).padStart(3,'0')} in print<br>${new Date().toLocaleDateString('en-US',{year:'numeric', month:'long'})}`;
}

/* ---------------- storage ---------------- */
async function loadAll(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    articles = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){
    articles = [];
  }
  try{
    const res = await window.storage.get(CONFIG_KEY, true);
    config = res && res.value ? JSON.parse(res.value) : null;
  }catch(e){
    config = null;
  }
  articles.sort((a,b)=> new Date(b.date) - new Date(a.date));
  updateMasthead();
}

async function saveArticles(){
  await window.storage.set(STORAGE_KEY, JSON.stringify(articles), true);
}

async function saveConfig(){
  await window.storage.set(CONFIG_KEY, JSON.stringify(config), true);
}

/* ---------------- routing ---------------- */
function setRoute(r){
  route = r;
  render();
}

function setActiveTab(){
  tabRead.classList.toggle('active', route.view !== 'write');
  tabWrite.classList.toggle('active', route.view === 'write');
}

tabRead.addEventListener('click', ()=> setRoute({view:'index'}));
tabWrite.addEventListener('click', ()=> setRoute({view:'write'}));

/* ---------------- render: index ---------------- */
function renderIndex(){
  setActiveTab();
  if(articles.length === 0){
    app.innerHTML = `
      <div class="empty fade-in">
        <div class="stamp">Nothing set yet</div>
        <p>The first sheet hasn't gone to press. Head to <strong>Write</strong> to publish it.</p>
      </div>`;
    return;
  }
  const rows = articles.map((a, i) => {
    const num = String(articles.length - i).padStart(2,'0');
    return `
      <a class="entry fade-in" href="#" data-id="${a.id}">
        <div class="entry-row">
          <span class="entry-num">${num}</span>
          <span class="entry-title">${escapeHtml(a.title)}</span>
        </div>
        <p class="entry-excerpt">${escapeHtml(a.excerpt)}</p>
        <div class="entry-meta">${formatDate(a.date)} &middot; ${a.readMins} min read</div>
      </a>`;
  }).join('');
  app.innerHTML = `
    <div class="issue-line">Current issue &middot; ${articles.length} piece${articles.length===1?'':'s'}</div>
    ${rows}
  `;
  app.querySelectorAll('.entry').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.preventDefault();
      setRoute({view:'article', id: el.dataset.id});
    });
  });
}

/* ---------------- render: article ---------------- */
function renderArticle(id){
  setActiveTab();
  const a = articles.find(x => x.id === id);
  if(!a){ setRoute({view:'index'}); return; }
  app.innerHTML = `
    <div class="article-nav"><a href="#" id="backLink">&larr; Back to issue</a></div>
    <article class="piece fade-in">
      <div class="piece-eyebrow">Dispatch</div>
      <h2>${escapeHtml(a.title)}</h2>
      <div class="byline">${formatDate(a.date)} &middot; ${a.readMins} min read${a.author ? ' &middot; ' + escapeHtml(a.author) : ''}</div>
      <div class="body-text">${paragraphize(a.content)}</div>
      <div class="danger-zone" id="dangerZone"></div>
    </article>
  `;
  document.getElementById('backLink').addEventListener('click', (e)=>{ e.preventDefault(); setRoute({view:'index'}); });

  if(unlocked){
    const dz = document.getElementById('dangerZone');
    dz.innerHTML = `<button class="btn-ghost-danger" id="deleteBtn">Retract this piece</button>`;
    dz.querySelector('#deleteBtn').addEventListener('click', async ()=>{
      if(confirm('Retract this article? This removes it for every reader.')){
        articles = articles.filter(x => x.id !== id);
        await saveArticles();
        updateMasthead();
        showToast('Article retracted.');
        setRoute({view:'index'});
      }
    });
  }
}

/* ---------------- render: write ---------------- */
function renderWrite(){
  setActiveTab();

  if(!config){
    app.innerHTML = `
      <div class="lock-panel fade-in">
        <div class="stamp-small">First time setup</div>
        <p>Set a passphrase for publishing. Anyone with it can post or retract articles here — keep it to yourself and whoever else should write for this site.</p>
        <div class="field">
          <label for="newPass">New passphrase</label>
          <input type="password" id="newPass" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
        </div>
        <button class="btn-primary" id="setPassBtn">Set passphrase</button>
        <div class="error-text" id="setPassErr"></div>
      </div>
    `;
    document.getElementById('setPassBtn').addEventListener('click', async ()=>{
      const val = document.getElementById('newPass').value;
      if(!val || val.length < 4){
        document.getElementById('setPassErr').textContent = 'Use at least 4 characters.';
        return;
      }
      config = { passphrase: val };
      await saveConfig();
      unlocked = true;
      showToast('Passphrase set. You\u2019re unlocked.');
      renderWrite();
    });
    return;
  }

  if(!unlocked){
    app.innerHTML = `
      <div class="lock-panel fade-in">
        <div class="stamp-small">Locked</div>
        <p>Enter the publishing passphrase to write or manage articles.</p>
        <div class="field">
          <label for="passInput">Passphrase</label>
          <input type="password" id="passInput" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
        </div>
        <div class="row-btn">
          <button class="btn-primary" id="unlockBtn">Unlock</button>
        </div>
        <div class="error-text" id="unlockErr"></div>
      </div>
    `;
    const tryUnlock = async ()=>{
      const val = document.getElementById('passInput').value;
      if(val === config.passphrase){
        unlocked = true;
        renderWrite();
      }else{
        document.getElementById('unlockErr').textContent = 'That\u2019s not it. Try again.';
      }
    };
    document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
    document.getElementById('passInput').addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
    return;
  }

  app.innerHTML = `
    <div class="compose-head fade-in">
      <h2>Set a new piece</h2>
      <p>What you publish here appears for every reader of this site, right away.</p>
    </div>
    <div class="field">
      <label for="titleInput">Title</label>
      <input type="text" id="titleInput" placeholder="The headline">
    </div>
    <div class="field">
      <label for="authorInput">Byline (optional)</label>
      <input type="text" id="authorInput" placeholder="Your name">
    </div>
    <div class="field">
      <label for="contentInput">Article</label>
      <textarea id="contentInput" placeholder="Write the piece. Leave a blank line between paragraphs."></textarea>
      <div class="hint" id="wordHint">0 words &middot; ~1 min read</div>
    </div>
    <button class="btn-primary" id="publishBtn">Publish</button>
    <button class="btn-text" id="lockBtn">Lock this session</button>
  `;

  const contentInput = document.getElementById('contentInput');
  contentInput.addEventListener('input', ()=>{
    const mins = readMins(contentInput.value || '');
    const words = (contentInput.value.trim().match(/\S+/g) || []).length;
    document.getElementById('wordHint').textContent = `${words} words \u00b7 ~${mins} min read`;
  });

  document.getElementById('lockBtn').addEventListener('click', ()=>{
    unlocked = false;
    renderWrite();
  });

  document.getElementById('publishBtn').addEventListener('click', async ()=>{
    const title = document.getElementById('titleInput').value.trim();
    const author = document.getElementById('authorInput').value.trim();
    const content = contentInput.value.trim();
    if(!title || !content){
      showToast('Give it a title and some words first.');
      return;
    }
    const btn = document.getElementById('publishBtn');
    btn.disabled = true; btn.textContent = 'Publishing\u2026';

    const firstPara = content.split(/\n\s*\n/)[0].trim();
    const excerpt = firstPara.length > 140 ? firstPara.slice(0,140).trim() + '\u2026' : firstPara;

    const article = {
      id: (Date.now().toString(36) + Math.random().toString(36).slice(2,7)),
      title, author, content, excerpt,
      date: new Date().toISOString(),
      readMins: readMins(content)
    };
    articles.unshift(article);
    try{
      await saveArticles();
      updateMasthead();
      showToast('Published.');
      setRoute({view:'article', id: article.id});
    }catch(e){
      showToast('Couldn\u2019t save \u2014 try again.');
      btn.disabled = false; btn.textContent = 'Publish';
    }
  });
}

/* ---------------- main render dispatch ---------------- */
function render(){
  if(route.view === 'index') renderIndex();
  else if(route.view === 'article') renderArticle(route.id);
  else if(route.view === 'write') renderWrite();
}

/* ---------------- init ---------------- */
(async function init(){
  app.innerHTML = `<div class="empty">Setting the type&hellip;</div>`;
  await loadAll();
  render();
})();
</script>
</body>
</html>
